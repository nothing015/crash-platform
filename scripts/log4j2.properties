# Spark logging for our jobs: errors only, no timestamps.
# Default level is error. For the full Spark logs when debugging, run the container with
#   -e SPARK_LOG_LEVEL=info     (or warn)
rootLogger.level = ${env:SPARK_LOG_LEVEL:-error}
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %p %c{1}: %m%n%ex