services:
  spark:
    # image: spark:4.1.1-python3
    build: .
    user: root
    working_dir: /app
    volumes:
      - ./jobs:/app/jobs
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./results:/app/results
    ports:
      - '4040:4040'

  kafka:
    image: apache/kafka:4.2.0
    mem_limit: 1g
    ports:
      - '9092:9092'
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
  stream:
    build: ./stream
    mem_limit: 2g
    working_dir: /app
    volumes:
      - ./stream:/app/stream
      - ./sample_data:/app/sample_data
      - ./data:/app/data
      - ./results:/app/results
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PYTHONUNBUFFERED: '1'
    depends_on:
      - kafka

  # Part 3: the database that serves the answers to all three questions
  db:
    image: postgres:17-alpine
    mem_limit: 512m
    ports:
      - '5432:5432'
    environment:
      # Local demo database only: these are not real credentials
      POSTGRES_USER: crash
      POSTGRES_PASSWORD: crash
      POSTGRES_DB: crashes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crash -d crashes']
      interval: 2s
      timeout: 3s
      retries: 30

  serve:
    build: ./serve
    mem_limit: 512m
    working_dir: /app
    volumes:
      - ./serve:/app/serve
      - ./results:/app/results
    environment:
      DATABASE_URL: postgresql://crash:crash@db:5432/crashes
      PYTHONUNBUFFERED: '1'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: